      <line x1="128" y1="226" x2="260" y2="226" stroke="#cbe0e8" stroke-opacity="0.13" stroke-width="4" stroke-linecap="round"/><line x1="128" y1="276" x2="226" y2="276" stroke="#cbe0e8" stroke-opacity="0.09" stroke-width="4" stroke-linecap="round"/>
      <circle cx="378" cy="250" r="35" fill="none" stroke="#80cde9" stroke-opacity=".16" stroke-width="1.5"/>
