<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Bulk-collected Xiaohongshu posts sorted into type buckets and broken down to reveal why each went viral">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(20 .5 .5)">
      <stop offset="0" stop-color="#141a20"/>
      <stop offset="1" stop-color="#090c0f"/>
    </linearGradient>
    <radialGradient id="focus" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#80cde9" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#80cde9" stop-opacity=".055"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80cde9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#80cde9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#cbe0e8" stroke-opacity=".045" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  <ellipse cx="400" cy="250" rx="200" ry="160" fill="url(#focus)" filter="url(#softGlow)"/>
  <!-- LEFT: bulk collected cards (stacked grid of small notes) -->
  <g>
    <g fill="#cbe0e8" fill-opacity="0.05" stroke="#cbe0e8" stroke-opacity=".28" stroke-width="1.3">
      <rect x="72" y="128" width="52" height="66" rx="7"/>
      <rect x="132" y="128" width="52" height="66" rx="7"/>
      <rect x="72" y="204" width="52" height="66" rx="7"/>
      <rect x="132" y="204" width="52" height="66" rx="7"/>
      <rect x="72" y="280" width="52" height="66" rx="7"/>
      <rect x="132" y="280" width="52" height="66" rx="7"/>
    </g>
    <g stroke="#cbe0e8" stroke-opacity=".18" stroke-width="3" stroke-linecap="round">
      <line x1="82" y1="150" x2="114" y2="150"/><line x1="82" y1="162" x2="106" y2="162"/>
      <line x1="142" y1="150" x2="174" y2="150"/><line x1="142" y1="162" x2="166" y2="162"/>
      <line x1="82" y1="226" x2="114" y2="226"/><line x1="82" y1="238" x2="106" y2="238"/>
      <line x1="142" y1="226" x2="174" y2="226"/><line x1="142" y1="238" x2="166" y2="238"/>
      <line x1="82" y1="302" x2="114" y2="302"/><line x1="82" y1="314" x2="106" y2="314"/>
      <line x1="142" y1="302" x2="174" y2="302"/><line x1="142" y1="314" x2="166" y2="314"/>
    </g>
  </g>
  <!-- collection funnel lines into sort node -->
  <g fill="none" stroke="#80cde9" stroke-opacity="0.55" stroke-width="1.7" stroke-linecap="round">
    <path d="M186 161 C260 190 300 220 348 240"/>
    <path d="M186 237 C260 240 300 245 348 250"/>
    <path d="M186 313 C260 310 300 285 348 262"/>
  </g>
  <!-- CENTER: sort / bucket node -->
  <g>
    <circle cx="384" cy="250" r="30" fill="#cbe0e8" fill-opacity=".08" stroke="#80cde9" stroke-opacity=".6" stroke-width="2"/>
    <g stroke="#80cde9" stroke-opacity=".8" stroke-linecap="round" stroke-width="2.4">
      <line x1="372" y1="242" x2="396" y2="242"/>
      <line x1="376" y1="250" x2="392" y2="250"/>
      <line x1="380" y1="258" x2="388" y2="258"/>
    </g>
  </g>
  <!-- RIGHT: three type buckets, each with a viral-point marker (青star-ish spark) -->
  <g fill="none" stroke="#80cde9" stroke-opacity="0.64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M414 236 C470 206 510 182 556 172"/>
    <path d="M414 250 C480 250 510 250 556 250"/>
    <path d="M414 264 C470 294 510 318 556 328"/>
  </g>
  <g>
    <!-- bucket A -->
    <rect x="562" y="136" width="176" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <g transform="translate(588 172)"><path d="M0 -11 L3 -3 L11 -3 L4.5 2 L7 10 L0 5 L-7 10 L-4.5 2 L-11 -3 L-3 -3 Z" fill="#80cde9" fill-opacity=".85"/></g>
    <line x1="608" y1="162" x2="712" y2="162" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="608" y1="180" x2="676" y2="180" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <!-- bucket B -->
    <rect x="562" y="214" width="176" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.045" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <g transform="translate(588 250)"><path d="M0 -11 L3 -3 L11 -3 L4.5 2 L7 10 L0 5 L-7 10 L-4.5 2 L-11 -3 L-3 -3 Z" fill="#80cde9" fill-opacity=".7"/></g>
    <line x1="608" y1="240" x2="712" y2="240" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="608" y1="258" x2="668" y2="258" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <!-- bucket C -->
    <rect x="562" y="292" width="176" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.045" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <g transform="translate(588 328)"><path d="M0 -11 L3 -3 L11 -3 L4.5 2 L7 10 L0 5 L-7 10 L-4.5 2 L-11 -3 L-3 -3 Z" fill="#80cde9" fill-opacity=".55"/></g>
    <line x1="608" y1="318" x2="712" y2="318" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="608" y1="336" x2="672" y2="336" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
