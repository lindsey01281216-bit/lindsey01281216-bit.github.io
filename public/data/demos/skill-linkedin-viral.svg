<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A high-engagement LinkedIn post being deconstructed and filed into a reusable swipe library">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(20 .5 .5)">
      <stop offset="0" stop-color="#141a20"/>
      <stop offset="1" stop-color="#090c0f"/>
    </linearGradient>
    <radialGradient id="focus" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#80cde9" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#80cde9" stop-opacity=".055"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80cde9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#80cde9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#cbe0e8" stroke-opacity=".045" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  <ellipse cx="200" cy="250" rx="170" ry="160" fill="url(#focus)" filter="url(#softGlow)"/>
  <!-- LEFT: one high-engagement post card with reaction/comment counters -->
  <g>
    <rect x="86" y="150" width="196" height="200" rx="12" fill="#cbe0e8" fill-opacity="0.08" stroke="#cbe0e8" stroke-opacity=".34" stroke-width="1.6"/>
    <circle cx="112" cy="178" r="12" fill="#cbe0e8" fill-opacity=".12" stroke="#cbe0e8" stroke-opacity=".3" stroke-width="1.3"/>
    <line x1="132" y1="172" x2="220" y2="172" stroke="#cbe0e8" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
    <line x1="132" y1="186" x2="188" y2="186" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <line x1="106" y1="216" x2="262" y2="216" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
    <line x1="106" y1="234" x2="242" y2="234" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <line x1="106" y1="252" x2="252" y2="252" stroke="#cbe0e8" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round"/>
    <!-- engagement burst -->
    <g>
      <circle cx="120" cy="316" r="12" fill="#80cde9" fill-opacity=".2" stroke="#80cde9" stroke-opacity=".62" stroke-width="1.5"/>
      <path d="M114 316 c0 -6 8 -6 6 1 c-2 -7 6 -7 6 -1 c0 5 -6 9 -6 9 c0 0 -6 -4 -6 -9 z" fill="#80cde9" fill-opacity=".8"/>
      <line x1="140" y1="316" x2="196" y2="316" stroke="#80cde9" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
      <circle cx="220" cy="316" r="10" fill="none" stroke="#80cde9" stroke-opacity=".55" stroke-width="1.6"/>
      <line x1="240" y1="316" x2="266" y2="316" stroke="#80cde9" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- CENTER: deconstruct node exploding into segments -->
  <g>
    <path d="M284 226 C320 214 344 208 368 202" fill="none" stroke="#80cde9" stroke-opacity="0.62" stroke-width="2" stroke-linecap="round"/>
    <path d="M284 250 C320 250 344 250 368 250" fill="none" stroke="#80cde9" stroke-opacity="0.62" stroke-width="2" stroke-linecap="round"/>
    <path d="M284 274 C320 286 344 292 368 298" fill="none" stroke="#80cde9" stroke-opacity="0.62" stroke-width="2" stroke-linecap="round"/>
    <circle cx="392" cy="250" r="26" fill="#cbe0e8" fill-opacity=".08" stroke="#80cde9" stroke-opacity=".6" stroke-width="2"/>
    <g stroke="#80cde9" stroke-opacity=".8" stroke-width="2" stroke-linecap="round">
      <line x1="392" y1="238" x2="392" y2="262"/><line x1="380" y1="250" x2="404" y2="250"/>
    </g>
  </g>
  <!-- RIGHT: swipe library — indexed card stack (tabbed) -->
  <g fill="none" stroke="#80cde9" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <path d="M418 236 C460 216 490 200 520 190"/>
    <path d="M418 264 C460 284 490 300 520 310"/>
  </g>
  <g>
    <rect x="524" y="134" width="200" height="232" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <!-- index tabs -->
    <rect x="540" y="120" width="46" height="20" rx="6" fill="#80cde9" fill-opacity=".2" stroke="#80cde9" stroke-opacity=".5" stroke-width="1"/>
    <rect x="592" y="120" width="46" height="20" rx="6" fill="#cbe0e8" fill-opacity=".08" stroke="#cbe0e8" stroke-opacity=".3" stroke-width="1"/>
    <rect x="644" y="120" width="46" height="20" rx="6" fill="#cbe0e8" fill-opacity=".08" stroke="#cbe0e8" stroke-opacity=".3" stroke-width="1"/>
    <!-- swipe entries -->
    <g>
      <rect x="542" y="158" width="164" height="40" rx="8" fill="#cbe0e8" fill-opacity=".05" stroke="#cbe0e8" stroke-opacity=".22" stroke-width="1.2"/>
      <circle cx="558" cy="178" r="5" fill="#80cde9" fill-opacity=".9"/>
      <line x1="574" y1="178" x2="692" y2="178" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
      <rect x="542" y="206" width="164" height="40" rx="8" fill="#cbe0e8" fill-opacity=".05" stroke="#cbe0e8" stroke-opacity=".22" stroke-width="1.2"/>
      <circle cx="558" cy="226" r="5" fill="#80cde9" fill-opacity=".7"/>
      <line x1="574" y1="226" x2="676" y2="226" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
      <rect x="542" y="254" width="164" height="40" rx="8" fill="#cbe0e8" fill-opacity=".05" stroke="#cbe0e8" stroke-opacity=".22" stroke-width="1.2"/>
      <circle cx="558" cy="274" r="5" fill="#80cde9" fill-opacity=".6"/>
      <line x1="574" y1="274" x2="686" y2="274" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
      <rect x="542" y="302" width="164" height="40" rx="8" fill="#cbe0e8" fill-opacity=".05" stroke="#cbe0e8" stroke-opacity=".22" stroke-width="1.2"/>
      <circle cx="558" cy="322" r="5" fill="#80cde9" fill-opacity=".5"/>
      <line x1="574" y1="322" x2="662" y2="322" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
