<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Messy tool returns passing through a contract filter that sorts them into ok, empty and error classes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(20 .5 .5)">
      <stop offset="0" stop-color="#141a20"/>
      <stop offset="1" stop-color="#090c0f"/>
    </linearGradient>
    <radialGradient id="focus" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#80cde9" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#80cde9" stop-opacity=".055"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80cde9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#80cde9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#cbe0e8" stroke-opacity=".045" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  <ellipse cx="400" cy="250" rx="150" ry="150" fill="url(#focus)" filter="url(#softGlow)"/>
  <!-- LEFT: messy incoming returns -->
  <g>
    <circle cx="96" cy="170" r="9" fill="#cbe0e8" fill-opacity=".1" stroke="#cbe0e8" stroke-opacity=".32" stroke-width="1.3"/>
    <circle cx="120" cy="250" r="9" fill="#cbe0e8" fill-opacity=".1" stroke="#cbe0e8" stroke-opacity=".32" stroke-width="1.3"/>
    <circle cx="96" cy="330" r="9" fill="#cbe0e8" fill-opacity=".1" stroke="#cbe0e8" stroke-opacity=".32" stroke-width="1.3"/>
    <circle cx="70" cy="220" r="6" fill="#cbe0e8" fill-opacity=".08" stroke="#cbe0e8" stroke-opacity=".26" stroke-width="1.2"/>
    <circle cx="72" cy="290" r="6" fill="#cbe0e8" fill-opacity=".08" stroke="#cbe0e8" stroke-opacity=".26" stroke-width="1.2"/>
    <path d="M105 172 C180 190 240 215 306 240" fill="none" stroke="#80cde9" stroke-opacity="0.5" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M130 250 C190 250 250 250 304 250" fill="none" stroke="#80cde9" stroke-opacity="0.5" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M105 328 C180 310 240 285 306 260" fill="none" stroke="#80cde9" stroke-opacity="0.5" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <!-- CENTER: contract / filter node -->
  <g>
    <path d="M306 200 L360 200 L392 250 L360 300 L306 300 L338 250 Z" fill="#cbe0e8" fill-opacity=".08" stroke="#80cde9" stroke-opacity=".6" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="352" cy="250" r="7" fill="#80cde9" fill-opacity=".92"/>
    <circle cx="349" cy="250" r="30" fill="none" stroke="#80cde9" stroke-opacity=".2" stroke-width="1.3" stroke-dasharray="3 6"/>
  </g>
  <!-- RIGHT: three sorted class buckets ok / empty / error -->
  <g>
    <path d="M392 240 C450 210 500 185 548 170" fill="none" stroke="#80cde9" stroke-opacity="0.64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 250 C460 250 500 250 548 250" fill="none" stroke="#80cde9" stroke-opacity="0.64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 260 C450 290 500 315 548 330" fill="none" stroke="#80cde9" stroke-opacity="0.64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ok bucket (filled dot) -->
    <g><rect x="556" y="134" width="176" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
      <circle cx="582" cy="170" r="9" fill="#80cde9" fill-opacity=".9"/>
      <line x1="602" y1="160" x2="704" y2="160" stroke="#cbe0e8" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
      <line x1="602" y1="178" x2="672" y2="178" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/></g>
    <!-- empty bucket (hollow dot) -->
    <g><rect x="556" y="214" width="176" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.045" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
      <circle cx="582" cy="250" r="9" fill="none" stroke="#80cde9" stroke-opacity=".8" stroke-width="2"/>
      <line x1="602" y1="240" x2="700" y2="240" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
      <line x1="602" y1="258" x2="664" y2="258" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/></g>
    <!-- error bucket (cross-marked dot) -->
    <g><rect x="556" y="294" width="176" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.045" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
      <circle cx="582" cy="330" r="9" fill="none" stroke="#80cde9" stroke-opacity=".85" stroke-width="2"/>
      <line x1="577" y1="325" x2="587" y2="335" stroke="#80cde9" stroke-opacity=".9" stroke-width="2" stroke-linecap="round"/>
      <line x1="587" y1="325" x2="577" y2="335" stroke="#80cde9" stroke-opacity=".9" stroke-width="2" stroke-linecap="round"/>
      <line x1="602" y1="320" x2="696" y2="320" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
      <line x1="602" y1="338" x2="668" y2="338" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/></g>
  </g>
</svg>
