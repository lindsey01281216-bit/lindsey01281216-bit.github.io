<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A finished video timeline split into effect, transition and caption layers traced back to their real draft names">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(20 .5 .5)">
      <stop offset="0" stop-color="#141a20"/>
      <stop offset="1" stop-color="#090c0f"/>
    </linearGradient>
    <radialGradient id="focus" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#80cde9" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#80cde9" stop-opacity=".055"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80cde9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#80cde9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#cbe0e8" stroke-opacity=".045" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  <ellipse cx="400" cy="150" rx="220" ry="120" fill="url(#focus)" filter="url(#softGlow)"/>
  <!-- TOP: assembled video timeline (single clip strip with frame ticks + playhead) -->
  <g>
    <rect x="96" y="118" width="608" height="64" rx="12" fill="#cbe0e8" fill-opacity="0.08" stroke="#cbe0e8" stroke-opacity=".34" stroke-width="1.6"/>
    <g stroke="#cbe0e8" stroke-opacity=".16" stroke-width="1.2">
      <line x1="176" y1="118" x2="176" y2="182"/><line x1="256" y1="118" x2="256" y2="182"/>
      <line x1="336" y1="118" x2="336" y2="182"/><line x1="416" y1="118" x2="416" y2="182"/>
      <line x1="496" y1="118" x2="496" y2="182"/><line x1="576" y1="118" x2="576" y2="182"/>
    </g>
    <path d="M136 118 l6 0 l0 6 l-3 5 l-3 -5 z" fill="#80cde9" fill-opacity=".9"/>
    <line x1="139" y1="112" x2="139" y2="188" stroke="#80cde9" stroke-opacity=".7" stroke-width="1.6"/>
  </g>
  <!-- split lines down to three layer lanes -->
  <g fill="none" stroke="#80cde9" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <path d="M240 182 C240 220 220 240 200 260"/>
    <path d="M400 182 C400 230 400 240 400 260"/>
    <path d="M560 182 C560 220 580 240 600 260"/>
  </g>
  <circle cx="200" cy="220" r="4" fill="#80cde9" fill-opacity=".9"/>
  <circle cx="400" cy="222" r="4" fill="#80cde9" fill-opacity=".9"/>
  <circle cx="600" cy="220" r="4" fill="#80cde9" fill-opacity=".9"/>
  <!-- THREE layer lanes: FX / transition / caption -->
  <g>
    <!-- FX lane (spark bursts) -->
    <rect x="96" y="264" width="180" height="60" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <g transform="translate(126 294)" stroke="#80cde9" stroke-opacity=".85" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-11" x2="0" y2="-4"/><line x1="0" y1="4" x2="0" y2="11"/>
      <line x1="-11" y1="0" x2="-4" y2="0"/><line x1="4" y1="0" x2="11" y2="0"/>
      <line x1="-8" y1="-8" x2="-3" y2="-3"/><line x1="3" y1="3" x2="8" y2="8"/>
      <line x1="8" y1="-8" x2="3" y2="-3"/><line x1="-3" y1="3" x2="-8" y2="8"/>
    </g>
    <line x1="150" y1="288" x2="256" y2="288" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="302" x2="228" y2="302" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <!-- transition lane (crossfade arrows) -->
    <rect x="310" y="264" width="180" height="60" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <g transform="translate(340 294)" stroke="#80cde9" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-12 -6 L0 -6"/><path d="M-4 -10 L0 -6 L-4 -2"/>
      <path d="M12 6 L0 6"/><path d="M4 2 L0 6 L4 10"/>
    </g>
    <line x1="364" y1="288" x2="470" y2="288" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="364" y1="302" x2="442" y2="302" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <!-- caption lane (text T) -->
    <rect x="524" y="264" width="180" height="60" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <g transform="translate(554 294)" stroke="#80cde9" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round">
      <line x1="-11" y1="-9" x2="11" y2="-9"/><line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
    <line x1="578" y1="288" x2="684" y2="288" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="578" y1="302" x2="656" y2="302" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- trace-down to real draft-name tags -->
  <g fill="none" stroke="#80cde9" stroke-opacity="0.55" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2 5">
    <line x1="186" y1="324" x2="186" y2="366"/>
    <line x1="400" y1="324" x2="400" y2="366"/>
    <line x1="614" y1="324" x2="614" y2="366"/>
  </g>
  <g>
    <!-- name tags (tag shape) -->
    <path d="M96 372 L246 372 L268 400 L246 428 L96 428 Z" fill="#cbe0e8" fill-opacity=".05" stroke="#80cde9" stroke-opacity=".5" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="116" cy="400" r="4" fill="#80cde9" fill-opacity=".85"/>
    <line x1="130" y1="400" x2="238" y2="400" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <path d="M310 372 L460 372 L482 400 L460 428 L310 428 Z" fill="#cbe0e8" fill-opacity=".05" stroke="#80cde9" stroke-opacity=".5" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="330" cy="400" r="4" fill="#80cde9" fill-opacity=".85"/>
    <line x1="344" y1="400" x2="452" y2="400" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <path d="M524 372 L674 372 L696 400 L674 428 L524 428 Z" fill="#cbe0e8" fill-opacity=".05" stroke="#80cde9" stroke-opacity=".5" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="544" cy="400" r="4" fill="#80cde9" fill-opacity=".85"/>
    <line x1="558" y1="400" x2="666" y2="400" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
