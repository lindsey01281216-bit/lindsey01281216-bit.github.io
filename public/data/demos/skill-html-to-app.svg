<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A self-contained HTML document packaged through a pipeline into a double-clickable macOS app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(20 .5 .5)">
      <stop offset="0" stop-color="#141a20"/>
      <stop offset="1" stop-color="#090c0f"/>
    </linearGradient>
    <radialGradient id="focus" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#80cde9" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#80cde9" stop-opacity=".055"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80cde9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#80cde9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#cbe0e8" stroke-opacity=".045" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  <ellipse cx="590" cy="250" rx="180" ry="160" fill="url(#focus)" filter="url(#softGlow)"/>
  <!-- LEFT: HTML document with folded corner + code lines + <> tag -->
  <g>
    <path d="M96 150 L186 150 L214 178 L214 350 L96 350 Z" fill="#cbe0e8" fill-opacity=".06" stroke="#cbe0e8" stroke-opacity=".34" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M186 150 L186 178 L214 178" fill="none" stroke="#cbe0e8" stroke-opacity=".34" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- angle-bracket mark -->
    <path d="M126 208 L114 220 L126 232" fill="none" stroke="#80cde9" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 208 L176 220 L164 232" fill="none" stroke="#80cde9" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="146" y1="204" x2="140" y2="236" stroke="#80cde9" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
    <line x1="116" y1="262" x2="194" y2="262" stroke="#cbe0e8" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="116" y1="278" x2="176" y2="278" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
    <line x1="116" y1="294" x2="188" y2="294" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <line x1="116" y1="310" x2="164" y2="310" stroke="#cbe0e8" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- CENTER: packaging pipeline (gear-ish node + segmented conduit) -->
  <g>
    <path d="M214 250 C260 250 288 250 328 250" fill="none" stroke="#80cde9" stroke-opacity="0.64" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#80cde9" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
      <line x1="238" y1="250" x2="250" y2="250"/><line x1="266" y1="250" x2="278" y2="250"/><line x1="294" y1="250" x2="306" y2="250"/>
    </g>
    <circle cx="360" cy="250" r="34" fill="#cbe0e8" fill-opacity=".07" stroke="#80cde9" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="360" cy="250" r="12" fill="#80cde9" fill-opacity=".85"/>
    <g stroke="#80cde9" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
      <line x1="360" y1="204" x2="360" y2="216"/><line x1="360" y1="284" x2="360" y2="296"/>
      <line x1="314" y1="250" x2="326" y2="250"/><line x1="394" y1="250" x2="406" y2="250"/>
      <line x1="328" y1="218" x2="336" y2="226"/><line x1="384" y1="274" x2="392" y2="282"/>
      <line x1="392" y1="218" x2="384" y2="226"/><line x1="336" y1="274" x2="328" y2="282"/>
    </g>
    <path d="M394 250 C440 250 468 250 502 250" fill="none" stroke="#80cde9" stroke-opacity="0.64" stroke-width="2" stroke-linecap="round"/>
    <path d="M493 245 L502 250 L493 255" fill="none" stroke="#80cde9" stroke-opacity=".82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- RIGHT: macOS app window with traffic-light dots + launch dock icon -->
  <g>
    <rect x="512" y="150" width="196" height="150" rx="12" fill="#cbe0e8" fill-opacity="0.08" stroke="#cbe0e8" stroke-opacity=".34" stroke-width="1.6"/>
    <line x1="512" y1="178" x2="708" y2="178" stroke="#cbe0e8" stroke-opacity=".22" stroke-width="1.3"/>
    <circle cx="528" cy="164" r="4" fill="#80cde9" fill-opacity=".9"/>
    <circle cx="542" cy="164" r="4" fill="#cbe0e8" fill-opacity=".28"/>
    <circle cx="556" cy="164" r="4" fill="#cbe0e8" fill-opacity=".28"/>
    <line x1="532" y1="204" x2="688" y2="204" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
    <line x1="532" y1="222" x2="640" y2="222" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <rect x="532" y="244" width="60" height="40" rx="8" fill="#80cde9" fill-opacity=".16" stroke="#80cde9" stroke-opacity=".5" stroke-width="1.4"/>
    <line x1="612" y1="252" x2="688" y2="252" stroke="#cbe0e8" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <line x1="612" y1="270" x2="662" y2="270" stroke="#cbe0e8" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round"/>
    <!-- app icon in dock below -->
    <rect x="576" y="332" width="60" height="60" rx="14" fill="#80cde9" fill-opacity=".18" stroke="#80cde9" stroke-opacity=".64" stroke-width="1.8"/>
    <circle cx="606" cy="362" r="12" fill="#80cde9" fill-opacity=".85"/>
    <path d="M606 322 C606 312 606 308 606 302" fill="none" stroke="#80cde9" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 5"/>
  </g>
</svg>
