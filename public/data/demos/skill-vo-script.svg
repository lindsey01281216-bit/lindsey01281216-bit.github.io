<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="One source splitting into three language voiceover scripts each built from hook, pacing and call to action blocks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(20 .5 .5)">
      <stop offset="0" stop-color="#141a20"/>
      <stop offset="1" stop-color="#090c0f"/>
    </linearGradient>
    <radialGradient id="focus" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#80cde9" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#80cde9" stop-opacity=".055"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80cde9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#80cde9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#80cde9" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#cbe0e8" stroke-opacity=".045" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  <ellipse cx="160" cy="250" rx="150" ry="150" fill="url(#focus)" filter="url(#softGlow)"/>
  <!-- LEFT: single source node (microphone / waveform) -->
  <g>
    <circle cx="160" cy="250" r="44" fill="#cbe0e8" fill-opacity=".07" stroke="#80cde9" stroke-opacity=".62" stroke-width="1.8"/>
    <circle cx="160" cy="250" r="66" fill="none" stroke="#80cde9" stroke-opacity=".18" stroke-width="1.4" stroke-dasharray="3 7"/>
    <g stroke="#80cde9" stroke-linecap="round">
      <line x1="140" y1="250" x2="140" y2="250" stroke-opacity=".9" stroke-width="4"/>
      <line x1="150" y1="238" x2="150" y2="262" stroke-opacity=".85" stroke-width="4"/>
      <line x1="160" y1="228" x2="160" y2="272" stroke-opacity=".95" stroke-width="4"/>
      <line x1="170" y1="240" x2="170" y2="260" stroke-opacity=".8" stroke-width="4"/>
      <line x1="180" y1="234" x2="180" y2="266" stroke-opacity=".85" stroke-width="4"/>
    </g>
  </g>
  <!-- split lines to three branches -->
  <g fill="none" stroke="#80cde9" stroke-opacity="0.62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 232 C300 190 360 168 430 160"/>
    <path d="M204 250 C310 250 360 250 430 250"/>
    <path d="M204 268 C300 310 360 332 430 340"/>
  </g>
  <circle cx="300" cy="200" r="4" fill="#80cde9" fill-opacity=".9"/>
  <circle cx="330" cy="250" r="4" fill="#80cde9" fill-opacity=".9"/>
  <circle cx="300" cy="300" r="4" fill="#80cde9" fill-opacity=".9"/>
  <!-- three language script cards: EN / 中文 / BM, each with hook | pace | CTA rows -->
  <!-- row structure: top row = hook (青强调), middle = pacing (dashed), bottom = CTA (青rect) -->
  <g>
    <!-- EN -->
    <rect x="436" y="126" width="284" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <rect x="452" y="138" width="26" height="14" rx="4" fill="#80cde9" fill-opacity=".22" stroke="#80cde9" stroke-opacity=".5" stroke-width="1"/>
    <line x1="452" y1="164" x2="700" y2="164" stroke="#80cde9" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
    <line x1="452" y1="180" x2="628" y2="180" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
    <rect x="640" y="174" width="60" height="14" rx="7" fill="#80cde9" fill-opacity=".55"/>
    <!-- 中文 -->
    <rect x="436" y="214" width="284" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <rect x="452" y="226" width="26" height="14" rx="4" fill="#80cde9" fill-opacity=".22" stroke="#80cde9" stroke-opacity=".5" stroke-width="1"/>
    <line x1="452" y1="252" x2="700" y2="252" stroke="#80cde9" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
    <line x1="452" y1="268" x2="628" y2="268" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
    <rect x="640" y="262" width="60" height="14" rx="7" fill="#80cde9" fill-opacity=".55"/>
    <!-- BM -->
    <rect x="436" y="302" width="284" height="72" rx="12" fill="#cbe0e8" fill-opacity="0.06" stroke="#cbe0e8" stroke-opacity=".30" stroke-width="1.5"/>
    <rect x="452" y="314" width="26" height="14" rx="4" fill="#80cde9" fill-opacity=".22" stroke="#80cde9" stroke-opacity=".5" stroke-width="1"/>
    <line x1="452" y1="340" x2="700" y2="340" stroke="#80cde9" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
    <line x1="452" y1="356" x2="628" y2="356" stroke="#cbe0e8" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
    <rect x="640" y="350" width="60" height="14" rx="7" fill="#80cde9" fill-opacity=".55"/>
  </g>
</svg>
